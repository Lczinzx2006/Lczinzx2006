<text x="20" y="59" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#a43a2e">04</text><text x="78" y="27" font-family="Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="1.8" fill="#ee6551">EQUIPE</text>
